<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GSAP Scroll Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

   

    .container {
      position: relative;
      width: 100vw;
    }

    section {
      width: 100vw;
      height: 100vh;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      background: transparent;
    }

    .hero {
      background: #111;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .hero h1 {
      font-size: 5rem;
      text-align: center;
    }

    .cards {
      background: transparent
    }

    .cards .img {
      width: 900px;
      height: 700px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .cards .img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .footer {
      background: #222;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Hero Section -->
    <section class="hero pinned">
      <h1>Title</h1>
    </section>

    <!-- Cards Sections -->
    <section class="cards pinned"><div class="img"><img src="01.jpg" alt="card1"></div></section>
    <section class="cards pinned"><div class="img"><img src="02.jpg" alt="card2"></div></section>
    <section class="cards pinned"><div class="img"><img src="03.jpg" alt="card3"></div></section>
    <section class="cards pinned"><div class="img"><img src="04.jpg" alt="card4"></div></section>
    <section class="cards pinned"><div class="img"><img src="05.jpg" alt="card5"></div></section>
    <section class="cards pinned"><div class="img"><img src="06.jpg" alt="card6"></div></section>
    <section class="cards pinned"><div class="img"><img src="07.jpg" alt="card7"></div></section>
    <section class="cards scroll"><div class="img"><img src="08.jpg" alt="card8"></div></section>
    

    <!-- Footer -->
    <section class="footer">
      <p>Footer Section</p>
    </section>
  </div>

  <!-- GSAP + ScrollTrigger -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
        
    const footer = document.querySelector(".footer");
    const lastCard = document.querySelector(".cards .scroll");
    const pinnedSections = gsap.utils.toArray(".pinned");

    pinnedSections.forEach((section, index, sections) => {
        let img = section.querySelector(".img");
        let nextSection = sections[index + 1] || lastCard;
        let endScalePoint = `top+=${nextSection.offsetTop - section.offsetTop}`;

        gsap.to(section, {
            scrollTrigger: {
                trigger: section,
                start: "top top",
                end: index === sections.length - 1 
                    ? `+=${lastCard.offsetHeight / 2}`
                    : footer.offsetTop - window.innerHeight,
                pin: true,
                pinSpacing: false,
                scrub: 1,
            }
        });

        gsap.fromTo(
            img,
            { scale: 1 },
            {
                scale: 0.5,
                ease: "none",
                scrollTrigger: {
                    trigger: section,
                    start: "top top",
                    end: endScalePoint,
                    scrub: 1,
                }
            }
        );
    });

    const heroH1 = document.querySelector(".hero h1");

    ScrollTrigger.create({
        trigger: document.body,
        start: "top top",
        end: "+=400vh",
        scrub: 1,
        onUpdate: (self) => {
            let opacityProgress = self.progress;
            heroH1.style.opacity = 1 - opacityProgress;
        }
    });
});

  </script>
</body>
</html>
